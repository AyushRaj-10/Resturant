[pytest]
pythonpath = backend
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:starlette.testclient.*
markers =
    unit: Unit tests for schemas, pure rules, and component isolation
    api: API integration tests for CRUD, lifecycle, and AI endpoints
    agents: Multi-agent tools, runner, orchestrator, and guardrail tests
    security: Security policies, provenance checks, and adversarial scenarios
